<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>维真 Vera 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* 布局：左侧是评审用的页面索引与状态开关，右侧是 390×844 手机里的可点击原型。手机内部用 App 自己的墨 / 宣两套色，外框跟随浏览器主题。 */
:root{
  --page:#DDE2DA; --panel:#F3F5F0; --ink:#151D29; --muted:#56606A; --rule:rgba(21,29,41,.12);
  --accent:#206864; --accent-ink:#F7F8F4; --chip:#E6EAE3;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --num:"Inter","SF Pro Display",-apple-system,"Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0D1218; --panel:#141B24; --ink:#E3E7E0; --muted:#98A2A8; --rule:rgba(227,231,224,.12);
  --accent:#5DA39D; --accent-ink:#0D1218; --chip:#1D2631; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0D1218; --panel:#141B24; --ink:#E3E7E0; --muted:#98A2A8; --rule:rgba(227,231,224,.12);
  --accent:#5DA39D; --accent-ink:#0D1218; --chip:#1D2631; color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14px}
.wrap{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding-block:32px;padding-inline:16px;max-width:1180px;margin:0 auto}
/* ---------- 评审面板 ---------- */
.panel{width:300px;flex:none;background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px));max-height:calc(100vh - 32px);overflow:auto}
.panel h1{font-family:var(--serif);font-size:22px;margin:0;font-weight:700;letter-spacing:.02em}
.panel .lede{color:var(--muted);font-size:12.5px;line-height:1.6;margin:4px 0 0}
.grp{display:flex;flex-direction:column;gap:6px}
.grp>.lbl{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.idx button{font:inherit;font-size:12.5px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.idx{display:flex;flex-wrap:wrap;gap:5px}
.idx button{border-radius:8px;padding:4px 9px;background:var(--chip);border-color:transparent}
.idx button.on{outline:2px solid var(--accent);outline-offset:-2px}
.panel button:focus-visible,.phone button:focus-visible,.phone input:focus-visible{outline:2px solid #5DA39D;outline-offset:2px}
.panel input[type=range]{width:100%;accent-color:var(--accent)}
.hourlab{font-family:var(--serif);font-size:15px}
.foot{font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--rule);padding-top:12px}
@media (max-width:820px){
  .wrap{flex-direction:column-reverse;align-items:center;gap:20px;padding-block:16px}
  .panel{position:static;width:100%;max-width:430px;max-height:none;box-sizing:border-box}
}
/* ---------- 手机外框 ---------- */
.phone{width:390px;height:844px;max-width:100%;flex:none;border-radius:54px;background:#0B0F14;padding:11px;box-sizing:border-box;box-shadow:0 30px 60px -20px rgba(10,20,20,.45),inset 0 0 0 2px #2A333D}
.app{position:relative;width:100%;height:100%;border-radius:44px;overflow:hidden;background:var(--bg);color:var(--tx);font-family:var(--sans);transition:background .3s}
@media (max-width:430px){.phone{width:100%;height:calc(100vh - 24px);min-height:640px;border-radius:40px;padding:8px}.app{border-radius:33px}}
.app.mo{--bvT:#F5F2EC;--bvI:#F5F2EC;--bvC:#FF6F5E;--bg:#0f1622;--sf:rgba(30,40,54,.22);--sf2:rgba(255,255,255,.08);--tx:#F4F6F1;--mu:rgba(236,240,234,.68);--vit:#9FD0BF;--slp:#A6C4E8;--act:#DDB46E;--ext:#B9C6D0;--alr:#F4927C;--line:rgba(255,255,255,.12);--btn:rgba(255,255,255,.94);--btntx:#101823;--band:rgba(255,255,255,.10);
  --gblur:32px;--gsat:160%;--gbri:.88;--rimA:rgba(255,255,255,.55);--rimB:rgba(255,255,255,.12);--rimC:rgba(255,255,255,.03);--rimD:rgba(255,255,255,.28);--edge:rgba(255,255,255,.07);--spec:rgba(255,255,255,.10);--ghi:rgba(255,255,255,.16);--gbd:rgba(255,255,255,.16);--shadow:rgba(0,0,0,.5);--tabon:rgba(255,255,255,.24);--scrim:linear-gradient(180deg,rgba(6,10,16,.34) 0%,rgba(6,10,16,.24) 30%,rgba(6,10,16,.34) 70%,rgba(6,10,16,.58) 100%);--veil:rgba(9,13,19,.66);--tsh:0 1px 12px rgba(0,0,0,.45);--hatch:rgba(255,255,255,.10)}
.app.xuan{--bvT:#0E4D5C;--bvI:#12333B;--bvC:#EC5A47;--bg:#EEF1EC;--sf:rgba(255,255,255,.26);--sf2:rgba(20,32,43,.06);--tx:#10202A;--mu:rgba(17,32,42,.62);--vit:#1B6A63;--slp:#2A55A0;--act:#A0531C;--ext:#46596A;--alr:#C3241C;--line:rgba(17,32,42,.10);--btn:#1C5D58;--btntx:#F7F8F4;--band:rgba(17,32,42,.07);
  --gblur:32px;--gsat:170%;--gbri:1.10;--rimA:rgba(255,255,255,.95);--rimB:rgba(255,255,255,.35);--rimC:rgba(255,255,255,.10);--rimD:rgba(255,255,255,.70);--edge:rgba(255,255,255,.34);--spec:rgba(255,255,255,.38);--ghi:rgba(255,255,255,.55);--gbd:rgba(255,255,255,.70);--shadow:rgba(40,52,62,.30);--tabon:rgba(255,255,255,.55);--scrim:linear-gradient(180deg,rgba(246,248,245,.30) 0%,rgba(246,248,245,.14) 30%,rgba(246,248,245,.40) 70%,rgba(246,248,245,.62) 100%);--veil:rgba(236,239,234,.70);--tsh:0 1px 14px rgba(255,255,255,.55);--hatch:rgba(17,32,42,.10)}
.sky{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.scrim{position:absolute;inset:0;z-index:0;pointer-events:none;background:var(--scrim)}
/* 详情页“收墨”：在山水上加一层模糊和墨色，让曲线和数字读得清 */
.veil{position:absolute;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .5s ease;background:var(--veil);-webkit-backdrop-filter:blur(36px) saturate(105%);backdrop-filter:blur(36px) saturate(105%)}
.app.calm .veil{opacity:1}
.app.calm{--sf:rgba(255,255,255,.055);--spec:rgba(255,255,255,.05)}
.app.calm.xuan{--sf:rgba(255,255,255,.42);--spec:rgba(255,255,255,.4)}
.scroll{z-index:1}
/* 数字：细到常规字重的等宽数字（参考 Oura），长辈视图（简洁视图 C）加粗一档保证读数 */
.app{--nwH:300;--nwM:400;font-variant-numeric:tabular-nums}
.app.elder{--nwH:500;--nwM:600}
/* 长辈模式：内容整体放大约 15%（版式随之重排），底栏标签 14px */
.app.elder .scroll>*{zoom:1.15}
.app.elder .tab{font-size:14px;max-width:70px}
.app.elder .fab span{font-size:13px}
/* ---------- 液态玻璃：低染色 + 强模糊 + 亮边 + 边缘厚度 + 顶部高光 ---------- */
.card,.pick,.tabbar,.sheet,.msg.v,.banner,.segm,.habit,.btn.ghost,.chip,.fab,.selbtn{
  -webkit-backdrop-filter:blur(var(--gblur)) saturate(var(--gsat)) brightness(var(--gbri));backdrop-filter:blur(var(--gblur)) saturate(var(--gsat)) brightness(var(--gbri));
  background-color:var(--sf);border:0!important;isolation:isolate;
  box-shadow:inset 0 0 22px var(--edge),inset 0 1px 1px var(--rimD),0 20px 44px -26px var(--shadow),0 2px 6px -3px var(--shadow)}
.card,.pick,.sheet,.msg.v,.banner,.segm,.habit,.btn.ghost,.chip,.selbtn{position:relative}
.card::before,.pick::before,.tabbar::before,.sheet::before,.msg.v::before,.banner::before,.segm::before,.habit::before,.btn.ghost::before,.chip::before,.fab::before,.selbtn::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:2;
  background:linear-gradient(145deg,var(--rimA) 0%,var(--rimB) 20%,var(--rimC) 48%,var(--rimC) 62%,var(--rimB) 82%,var(--rimD) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.card::after,.pick::after,.tabbar::after,.sheet::after,.msg.v::after,.banner::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(130% 70% at 18% -18%,var(--spec),transparent 58%),radial-gradient(90% 50% at 100% 115%,var(--spec),transparent 60%)}
.pick.on::before{background:linear-gradient(145deg,var(--vit),color-mix(in srgb,var(--vit) 30%,transparent) 50%,var(--vit));padding:1.5px}
.h1,.serif-hero{text-shadow:var(--tsh)}
.sbar{text-shadow:var(--tsh)}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:30}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 30px;font-size:14px;font-weight:600;z-index:25;pointer-events:none}
.sbar .r{display:flex;gap:6px;align-items:center}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding-top:50px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.scroll.hastab{padding-bottom:104px}
.pad{padding:0 20px}
.stack{display:flex;flex-direction:column;gap:14px}

/* ---------- 一体化：今日页主视觉直接压在风景上；身体页指标连成一块 ---------- */
.hero{min-height:600px;display:flex;flex-direction:column;gap:14px}
.hero .grow{flex:1;min-height:24px}
.hpair{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.hp{background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0}
.hp .eb{font-size:12.5px;letter-spacing:.04em;font-weight:600;text-shadow:var(--tsh)}
.hp .hn{display:block;font-family:var(--num);font-size:54px;font-weight:var(--nwH);letter-spacing:-.04em;line-height:1.05;margin-top:4px;text-shadow:var(--tsh)}
.hp .hn small{font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:0;margin-left:4px;color:var(--mu)}
.hero-h{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1.3;margin:2px 0 0;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere;text-shadow:var(--tsh)}
.hero .why{font-size:14.5px;line-height:1.6;color:var(--tx);opacity:.86;margin:0;text-shadow:var(--tsh)}
.hchips{display:flex;gap:8px;flex-wrap:wrap}
.hchips .chip{color:var(--tx);font-size:14px;padding:8px 12px;cursor:pointer;min-height:36px}
.hchips .chip b{font-family:var(--num);font-weight:600}
.rbar{position:relative;height:30px;margin-top:6px}
.rbar .tl{position:absolute;left:0;right:0;top:8px;height:2px;border-radius:2px;background:var(--hatch)}
.rbar .bd{position:absolute;top:6px;height:6px;border-radius:3px;background:var(--c);opacity:.38}
.rbar .dt{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px var(--bg)}
.rbar .lb{position:absolute;top:15px;font-size:12px;color:var(--mu);font-family:var(--num);white-space:nowrap}
.rbar .lb.lo{transform:translateX(-100%)}
.card.vitals{padding:0;overflow:hidden}
.vrow{display:grid;grid-template-columns:1fr 1.15fr;gap:4px 14px;align-items:center;width:100%;padding:16px 18px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,transparent),color-mix(in srgb,var(--c) 4%,transparent));border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;position:relative}
.vrow+.vrow{box-shadow:inset 0 1px 0 var(--line)}
.vrow .nm{display:flex;align-items:center;gap:10px;grid-column:1/3}
.vrow .nm .ic{width:30px;height:30px;border-radius:50%;color:var(--c)}
.vrow .nm .st{display:block;font-size:12.5px;letter-spacing:.02em;font-weight:600;color:var(--c);margin-top:1px}
.vrow .nm .chev{margin-left:auto}
.vrow .vv{font-family:var(--num);font-size:38px;font-weight:var(--nwH);letter-spacing:-.03em;line-height:1}
.vrow .vv small{font-family:var(--sans);font-size:13px;color:var(--mu);margin-left:3px;letter-spacing:0}
.story{padding:4px 2px}
.story .eb{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.04em;font-weight:600}
/* 页头水墨 */
.ink{position:absolute;top:0;left:0;right:0;height:250px;pointer-events:none;z-index:0}
.ink svg{width:100%;height:100%;display:block}
.above{position:relative;z-index:1}
/* 文本 */
.serif{font-family:var(--serif)}
.h1{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.25;margin:0;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere}
.h2{font-family:var(--serif);font-size:20px;font-weight:600;margin:0}
.h3{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em}
.mu{color:var(--mu)}
.sm{font-size:13.5px}
.xs{font-size:12.5px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big-num small{font-family:var(--sans);font-size:13px;font-weight:400;color:var(--mu);margin:0 6px 0 3px;letter-spacing:0}
.big-num{font-family:var(--num);font-weight:var(--nwH);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.eyebrow{font-size:12.5px;letter-spacing:.04em;color:var(--mu);font-weight:500}
.trk{height:6px;border-radius:3px;margin-top:6px;background:var(--band);overflow:hidden}
.trk>i{display:block;height:100%;border-radius:4px}
.p{font-size:15px;line-height:1.65;margin:0}
/* 卡片 */
.card{border-radius:28px;padding:18px 18px 18px}
.card.tap{cursor:pointer;display:block;width:100%;text-align:left;font:inherit;color:inherit}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:4px 10px;border-radius:999px;color:var(--mu);white-space:nowrap}
.chip.vit{color:var(--vit)}
.chip.alr{color:var(--alr)}
.chip.dim{opacity:.6}
.btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 26px -14px var(--shadow);letter-spacing:.02em;display:flex;justify-content:center;align-items:center;gap:8px;width:100%;min-height:50px;border-radius:16px;border:0;background:var(--btn);color:var(--btntx);font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.btn.ghost{color:var(--tx)}
.btn.sm{min-height:38px;font-size:13.5px;border-radius:12px;width:auto;padding:0 14px}
.link{background:none;border:0;color:var(--vit);font:inherit;font-size:14px;cursor:pointer;padding:6px 0;min-height:32px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;width:100%;cursor:pointer;min-height:48px}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.ic{width:34px;height:34px;border-radius:11px;background:var(--sf2);display:grid;place-items:center;flex:none;color:var(--vit)}
.ic svg{width:18px;height:18px}
.chev{color:var(--mu);flex:none}
.disc{font-size:12.5px;line-height:1.6;color:var(--mu);border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
/* 顶栏 */
.nav{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;min-height:48px;position:relative;z-index:2}
.nav .ttl{flex:1;text-align:center;font-size:16px;font-weight:600;letter-spacing:.04em}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;background:none;border:0;color:var(--tx);cursor:pointer;border-radius:12px}
/* 标签栏 */
.tabbar{position:absolute;left:14px;right:88px;bottom:18px;height:64px;border-radius:32px;display:flex;justify-content:space-around;align-items:center;padding:0 5px;z-index:20}
.tab{flex:1;max-width:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;font-weight:500;cursor:pointer;height:54px;border-radius:27px;transition:background .25s}
.tab .bub{width:30px;height:26px;display:grid;place-items:center}
.tab.on{color:var(--tx)}
.tab.on{background:var(--tabon);color:var(--vit);box-shadow:inset 0 1px 1px var(--rimD),inset 0 0 10px var(--edge)}
.fab{position:absolute;right:14px;bottom:18px;z-index:21;display:grid;place-items:center;width:64px;height:64px;border-radius:32px;color:var(--tx);font:inherit;cursor:pointer}
.fab span{font-size:11.5px;font-weight:500;color:var(--mu);margin-top:-4px}
.fab svg{color:var(--vit)}
/* 圆环 */
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.ringbtn{background:none;border:0;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0;border-radius:16px}
.ringwrap{position:relative;width:min(92px,100%);aspect-ratio:1}
.rings>*,.balance>*{min-width:0}
.ringwrap svg{position:absolute;inset:0}
.ringwrap .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .big{font-family:var(--num);font-size:28px;font-weight:var(--nwM);line-height:1;letter-spacing:-.03em}
.ringwrap .unit{font-size:12px;color:var(--mu);margin-top:3px}
.balance{position:relative;display:grid;grid-template-columns:2fr 1fr}
.balance .brk{grid-column:1;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mu);justify-content:center;margin-top:2px}
.balance .brk::before,.balance .brk::after{content:"";flex:1;height:1px;background:var(--line)}
/* 横幅 */
.banner{display:flex;gap:10px;align-items:flex-start;padding:13px 15px;border-radius:20px;font-size:13px;line-height:1.55}
.banner svg{flex:none;margin-top:2px}
.banner.alr{background-color:color-mix(in srgb,var(--alr) 16%,var(--sf))}
.banner.alr svg{color:var(--alr)}
/* 分段 */
.segm{display:flex;border-radius:14px;padding:3px}
.segm button{flex:1;border:0;background:transparent;color:var(--mu);font:inherit;font-size:14px;padding:7px 0;border-radius:11px;cursor:pointer;min-height:34px;position:relative;z-index:3}
.segm button.on{background:var(--tabon);color:var(--tx);font-weight:600;box-shadow:inset 0 1px 1px var(--rimD),0 2px 6px -2px var(--shadow)}
/* 开关 */
.sw{width:46px;height:28px;border-radius:14px;background:var(--sf2);border:0;position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.sw[aria-checked="true"]{background:var(--vit)}
.sw[aria-checked="true"]::after{left:21px}
/* 输入 */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;color:var(--mu)}
.field input{font:inherit;font-size:17px;padding:13px 14px;border-radius:16px;border:1px solid var(--gbd);background:var(--sf);color:var(--tx)}
/* 选择卡 */
.pick{display:flex;gap:12px;align-items:center;padding:16px;border-radius:22px;color:inherit;font:inherit;text-align:left;cursor:pointer;width:100%}
.pick.on{border-color:var(--vit)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--vit) 18%,transparent)}

.packs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.packs .pick{flex-direction:column;align-items:flex-start;gap:6px;padding:14px;position:relative}
.packs .tick{position:absolute;top:12px;right:12px}
/* 习惯 */
.habits{display:flex;flex-wrap:wrap;gap:8px}
.habit{color:var(--tx);font:inherit;font-size:14px;padding:7px 13px;border-radius:999px;cursor:pointer;min-height:36px}
.habit.on{background-color:color-mix(in srgb,var(--vit) 22%,var(--sf));color:var(--vit)}
/* 统计格 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat .k{font-size:12.5px;color:var(--mu)}
.stat .v{font-family:var(--num);font-size:23px;font-weight:var(--nwM);margin-top:2px;letter-spacing:-.02em}
.stat .v small{font-family:var(--sans);letter-spacing:0;font-size:12.5px;font-weight:400;color:var(--mu);margin-left:2px}
/* 雷达 */
.radar{position:relative;width:200px;height:200px;margin:10px auto}
.radar span{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--vit);opacity:0;animation:pulse 2.4s infinite}
.radar span:nth-child(2){animation-delay:.8s}.radar span:nth-child(3){animation-delay:1.6s}
.radar .core{position:absolute;inset:70px;border-radius:50%;background:var(--sf2);display:grid;place-items:center;color:var(--vit)}
@keyframes pulse{0%{transform:scale(.35);opacity:.9}100%{transform:scale(1);opacity:0}}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:center;font-size:14.5px;color:var(--mu)}
.step .dot{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}

.qs{display:flex;gap:8px;flex-wrap:wrap}

.tl{display:flex;flex-direction:column}
.tli{display:grid;grid-template-columns:48px 14px 1fr;gap:10px;align-items:start;padding-bottom:16px;position:relative}
.tli .tm{font-size:13.5px;color:var(--mu);padding-top:2px}
.tli .nd{width:10px;height:10px;border-radius:50%;background:var(--vit);margin-top:6px;position:relative}
.tli:not(:last-child) .nd::after{content:"";position:absolute;left:4px;top:12px;width:2px;height:52px;background:var(--line)}
/* 卡片顶部的小日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:10px 5px}
.cal i{display:block;height:12px;width:12px;justify-self:center;border-radius:50%;background:var(--sf2)}

.cal i.n{background:transparent;border:1px dashed var(--line)}

.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:80%;text-align:center}

function splashPg(kind){return{theme:'xuan',html:`<button class="bvsplash ${kind}" data-go="welcome" aria-label="启动页（${kind==='brz'?'呼吸':'依次点亮'}），点击继续">${BVST}<span class="xs" style="position:absolute;bottom:40px;opacity:.6">${kind==='brz'?'呼吸 · 3.2 秒一次':'依次点亮 · 1.65 秒一圈'}</span></button>`,
  after(){const me=cur();setTimeout(()=>{if(cur()===me&&!S.hold)jump('welcome')},kind==='brz'?6400:4950)}}}
P.splash=()=>splashPg('brz');
P.splash2=()=>splashPg('seq');
P.welcome=()=>({theme:'mo',html:`<div class="ink" style="height:520px">${ink('mo',3,520)}</div>
  <div class="pad above" style="min-height:760px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-bottom:40px">
   <div style="flex:1;display:grid;place-items:center;padding-top:40px"><div class="aurabox" style="width:100%">${aura(220,70,9,{label:'维真的动静两股光漩'})}</div></div>
   <div class="serif serif-hero" style="font-size:52px;font-weight:700;letter-spacing:.08em">维真</div>
   <div class="bvby" style="justify-content:flex-start;margin-top:-6px">${bvMark(18)}<span>医数云 BioVision 出品</span></div>
   <div class="card stack" style="gap:8px"><p class="p" style="font-size:17px;font-family:var(--serif)">每天看一眼，30 秒知道今天怎么过。</p>
   <p class="p sm mu">和自己的平常比，不和别人比。睡眠、元气、负荷、夜间呼吸与血氧，一处看懂。</p></div>
   <div style="height:18px"></div>
   <button class="btn" data-go="login">开始使用</button>
   <button class="btn ghost" data-go="login">已有账号，登录</button>
   <p class="xs mu" style="text-align:center;margin:6px 0 0">非医疗器械，数据仅供日常健康参考</p>
  </div>`});
P.login=()=>({theme:'mo',html:`${nav('')}<div class="pad stack" style="gap:18px">
   <h1 class="h1">用手机号登录</h1>
   <div class="field"><label for="f-phone">手机号</label><input id="f-phone" inputmode="numeric" value="138 0013 8000"></div>
   <div class="field"><label for="f-code">验证码</label><div class="row"><input id="f-code" inputmode="numeric" placeholder="6 位数字" style="flex:1;min-width:0"><button class="btn sm ghost" data-act="code">获取验证码</button></div></div>
   <div class="row" style="align-items:flex-start;gap:10px"><button class="sw" role="switch" aria-checked="${S.agree}" data-act="agree" aria-label="同意协议"></button><span class="sm mu" style="line-height:1.6">我已阅读并同意《用户协议》《隐私政策》。健康数据存储在中国境内。</span></div>
   <div class="row" style="align-items:flex-start;gap:10px"><button class="sw" role="switch" aria-checked="${S.research}" data-act="research" aria-label="参与算法改进"></button><span class="sm mu" style="line-height:1.6">参与算法改进：上传夜间原始数据（可选，可随时在“隐私”里关闭）</span></div>
   <button class="btn" data-act="login">登录</button>
   <div class="row" style="gap:10px;align-items:center;margin-top:4px"><span style="flex:1;height:1px;background:var(--line)"></span><span class="xs mu">或</span><span style="flex:1;height:1px;background:var(--line)"></span></div><button class="btn ghost" data-act="wx">${ic('chat',18)} 微信一键登录</button></div>`});
P.mode=()=>({theme:'mo',html:`${nav('')}<div class="pad stack" style="gap:16px">
   <div class="sm mu">第 1 步，共 3 步</div>
   <h1 class="h1">你更想怎么看自己的身体？</h1>
   <p class="p mu sm">两种模式数据完全一样，只是首页内容和语气不同，之后可以随时切换。</p>
   ${[['yang','养生模式','结论先说人话，用节气和时辰讲时间。首页先看时令卡和“今日宜”。','leaf'],['young','青年模式','数字放大在前：今天练不练、练多狠、睡眠债多少。报告叫半月报。','spark']].map(([k,t,s,i])=>`<button class="pick ${S.mode===k?'on':''}" data-act="mode" data-v="${k}" aria-pressed="${S.mode===k}"><span class="ic">${ic(i)}</span><span class="t"><span class="h3" style="display:block">${t}</span><span class="sm mu">${s}</span></span><span class="tick">${ic('check',14,2.4)}</span></button>`).join('')}
   <div style="height:8px"></div><button class="btn" data-go="packs">下一步</button></div>`});
const PACKS=[['east','东方养生','体质问卷、时令饮食、八段锦'],['sport','运动表现','训练负荷、跑步与力量计划'],['work','职场减压','过劳提醒、1 分钟呼吸'],['sleep','睡眠改善','作息计划、睡前放松'],['female','女性健康','周期记录、体温趋势'],['elder','长辈关怀','大字、语音播报、用药提醒']];
P.packs=()=>({theme:'mo',html:`${nav('')}<div class="pad stack" style="gap:16px">
   <div class="sm mu">第 2 步，共 3 步</div>
   <h1 class="h1">选 1–3 个你关心的内容</h1>
   <p class="p mu sm">节气校准对所有人默认开启。内容包之后可以随时增减。</p>
   <div class="packs">${PACKS.map(([k,t,s])=>`<button class="pick ${S.packs.has(k)?'on':''}" data-act="pack" data-v="${k}" aria-pressed="${S.packs.has(k)}"><span class="tick">${ic('check',14,2.4)}</span><span class="h3">${t}</span><span class="xs mu" style="line-height:1.5">${s}</span></button>`).join('')}</div>
   <p class="xs mu">女性健康的体温趋势不用于避孕或备孕。</p>
   <button class="btn" data-go="device-choose">下一步</button></div>`});
P['device-choose']=()=>({theme:'mo',html:`${nav('')}<div class="pad stack" style="gap:16px">
   <div class="sm mu">第 3 步，共 3 步</div>
   <h1 class="h1">连接你的设备</h1>
   ${[['ring','维真戒指','全天戴着，睡觉也不硌手',''],['band','维真手环','无屏手环，可振动唤醒和提醒','']].map(([k,t,s,tag])=>`<button class="pick ${S.device===k?'on':''}" data-act="device" data-v="${k}" aria-pressed="${S.device===k}"><span class="ic" style="width:56px;height:56px;border-radius:16px">${ic(k,30,1.4)}</span><span class="t"><span class="h3" style="display:block">${t}</span><span class="sm mu">${s}</span>${tag?`<span class="preview" style="display:inline-block;margin-top:6px">${tag}</span>`:''}</span><span class="tick">${ic('check',14,2.4)}</span></button>`).join('')}
   <p class="xs mu" style="line-height:1.6">只接维真自己的设备来算核心分数。体重、血压计读数等非穿戴数据可以之后从 Apple 健康或 Health Connect 只读导入。</p>
   <button class="btn" data-go="wear">下一步</button>
   <button class="link" data-act="family-setup" style="align-self:center">帮家人开通</button></div>`});
P.wear=()=>{const ringy=S.device==='ring';return{theme:'mo',html:`${nav('佩戴方式')}<div class="pad stack" style="gap:16px">
   <div class="card" style="display:grid;place-items:center;height:200px;color:var(--vit)">${ringy?`<svg width="160" height="160" viewBox="0 0 160 160" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M60 150V60a12 12 0 0 1 24 0v90" stroke="var(--mu)"/><path d="M88 150V40a12 12 0 0 1 24 0v110" stroke="var(--mu)" opacity=".5"/><ellipse cx="72" cy="96" rx="17" ry="7" stroke-width="5"/><circle cx="72" cy="103" r="2.5" fill="currentColor"/></svg>`:`<svg width="170" height="160" viewBox="0 0 170 160" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M20 70h120a18 18 0 0 1 0 36H20" stroke="var(--mu)"/><rect x="62" y="62" width="34" height="52" rx="10" stroke-width="4"/><path d="M118 74v24" stroke="var(--mu)" stroke-dasharray="3 3"/><text x="104" y="130" font-size="11" fill="var(--mu)" stroke="none">腕骨</text></svg>`}</div>
   <h1 class="h1" style="font-size:24px">${ringy?'戴在食指或中指':'戴在腕骨上方一指处'}</h1>
   <div class="list">
    ${ringy?li('ring','能转动，但不会滑落','太松会让夜间血氧不准',null,''):li('band','松紧能塞进一根手指','太松会让心率和血氧不准',null,'')}
    ${ringy?li('spark','传感器凸起朝向掌心','',null,''):li('spark','传感器贴紧皮肤','',null,'')}
    ${li('moon','睡觉也戴着','夜间数据是元气和呼吸分析的基础',null,'')}
   </div>
   ${ringy?'<p class="xs mu">尺码不合适？可以在小程序免费换一次尺码。</p>':''}
   <button class="btn" data-go="scan">开始搜索</button></div>`}};
P.scan=()=>({theme:'mo',html:`${nav('搜索设备')}<div class="pad stack" style="gap:14px">
   <div class="radar"><span></span><span></span><span></span><div class="core">${ic(S.device,30,1.4)}</div></div>
   <p class="p" style="text-align:center">${S.scan?'找到 1 台设备，点一下连接':'让'+devName()+'靠近手机…'}</p>
   ${S.scan?`<button class="pick" data-go="pair"><span class="ic">${ic(S.device)}</span><span class="t"><span class="h3" style="display:block">${devName()} ${S.device==='ring'?'V80':''}</span><span class="sm mu">尾号 3A7F · 信号强</span></span><span class="chev">${ic('chev',16)}</span></button>`:''}
   <p class="xs mu" style="text-align:center">没找到？确认${S.device==='ring'?'戒指已放在充电座上唤醒':'手环已充电'}，并打开手机蓝牙。</p></div>`,
   after(){if(!S.scan){setTimeout(()=>{if(cur()==='scan'){S.scan=1;render()}},1600)}}});
const PAIRSTEPS=['连接设备','校验设备','同步时间与单位','检查固件','读取历史数据'];
P.pair=()=>({theme:'mo',html:`${nav('正在配对')}<div class="pad stack" style="gap:22px;padding-top:20px">
   <div style="display:grid;place-items:center;color:var(--vit)">${ic(S.device,64,1.1)}</div>
   <div class="steps">${PAIRSTEPS.map((t,i)=>`<div class="step ${i<S.pair?'done':i===S.pair?'run':''}"><span class="dot">${i<S.pair?ic('check',13,2.6):''}</span>${t}</div>`).join('')}</div>
   ${S.pair>=PAIRSTEPS.length?`<div class="card"><div class="h3">配对成功</div><p class="p sm mu" style="margin-top:4px">${devName()} · 尾号 3A7F · 电量 64% · 固件 1.2.3</p></div><button class="btn" data-go="perms">下一步</button>`:''}</div>`,
   after(){if(S.pair<PAIRSTEPS.length){setTimeout(()=>{if(cur()==='pair'){S.pair++;render()}},650)}}});
P.perms=()=>({theme:'mo',html:`${nav('')}<div class="pad stack" style="gap:16px">
   <h1 class="h1">还需要几个权限</h1>
   <div class="card list" style="padding:4px 16px">
    ${[['bt','bt','蓝牙（必需）','在后台同步夜间数据'],['notif','bell','通知','每天最多 2 条，22:30–7:00 静默'],['health','link','健康数据（只读，可选）','体重、血压计读数等非穿戴数据']].map(([k,i,t,s])=>`<div class="li" style="cursor:default"><span class="ic">${ic(i)}</span><span class="t"><span style="display:block">${t}</span><span class="sm mu">${s}</span></span><button class="sw" role="switch" aria-checked="${S.perms[k]}" data-act="perm" data-v="${k}" aria-label="${t}"></button></div>`).join('')}
   </div>
   ${S.device==='ring'?'<div class="banner">'+ic('bell',18)+'<div>戒指没有振动，起床闹钟和提醒都由手机发出。</div></div>':''}
   <button class="btn" data-go="baseline">下一步</button></div>`});
P.baseline=()=>({theme:'mo',html:`<div class="ink">${ink('mo',11)}</div><div class="pad stack above" style="gap:16px;padding-top:60px">
   ${aura(150,52,3,{label:'建立基线中：光漩会随着天数慢慢长粗'})}
   <h1 class="h1">前 14 天，一步步认识你</h1>
   <p class="p mu">我们先认识你的“平常”，再告诉你哪里不一样。前 7 天不会出元气分。</p>
   <div class="card"><div class="tl">
    ${[['第 1 天','睡眠时长','今晚戴着睡，明早就能看到'],['第 3 天','作息规律','几点睡、几点起，稳不稳定'],['第 7 天','个人范围与元气','HRV、静息心率、夜间呼吸的平常范围'],['第 14 天','第一份两周回顾','这两周睡眠、作息和身体的变化']].map(([d,t,s])=>`<div class="tli"><span class="tm">${d}</span><span class="nd"></span><span><span class="h3" style="display:block">${t}</span><span class="sm mu">${s}</span></span></div>`).join('')}
   </div></div>
   ${S.device==='ring'?`<div class="banner">${ic('battery',18)}<div>戒指电量 64%，够用两晚。建议睡前看一眼电量。</div></div>`:''}
   <button class="btn" data-act="finish">进入今日</button></div>`});

/* ---- 今日 ---- */
P.today=()=>{
  const C=S.dir==='C';
  const head=`<div class="between"><span class="sm mu">10月5日 周一 · 18°C</span>${devChip()}</div>`;
  if(C) return {theme:'mo',tab:'today',fab:false,html:`<div class="ink">${ink('mo',21)}</div><div class="pad stack above" style="padding-top:10px">
   ${head}
   <h1 class="h1" style="margin-top:18px">${greet()}，小林</h1>
   <div class="chat">

     <div class="qs"><button class="habit" data-go="vera" data-q="0">今天适合运动吗？</button><button class="habit" data-go="vera" data-q="1">昨晚睡得怎么样？</button></div>

   ${hero()}
   ${statusBanner()}
   ${YG()?trainCard():solarCard()}
   ${oxCard(false)}

/* 个人范围条：亮段是你的平常范围，圆点是今天 */
function rbar(v,lo,hi,mn,mx,c,fmt){const P=x=>Math.max(0,Math.min(100,(x-mn)/(mx-mn)*100));fmt=fmt||(x=>x);
  return `<div class="rbar" style="--c:${c}" aria-label="平常范围 ${fmt(lo)} 到 ${fmt(hi)}，今天 ${v==null?'暂无':fmt(v)}"><i class="tl"></i><i class="bd" style="left:${P(lo)}%;width:${P(hi)-P(lo)}%"></i>${v==null?'':`<i class="dt" style="left:${P(v)}%"></i>`}<span class="lb lo" style="left:calc(${P(lo)}% - 3px)">${fmt(lo)}</span><span class="lb" style="left:calc(${P(hi)}% + 3px)">${fmt(hi)}</span></div>`}
function hero(){
  const s=S.status,y=YG(),aur=S.viz==='aura'||S.viz==='ink',d=DEBT();
  const vit=s==='new'?null:s==='short'?null:s==='sick'?58:s==='dev'?61:72;
  const load=s==='sick'?null:9.6;
  const vSt=s==='new'?'第 1/7 天':s==='short'?'数据不足':s==='calib'?'校准中':s==='dev'?'比平常低一些':'和平常差不多';
  const lSt=s==='sick'?'已暂停':'适中';
  const vN=vit==null?(s==='new'?'1/7':'—'):vit,lN=s==='sick'?'—':'9.6';
  const whyY={normal:'昨夜子时到卯时，心跳一直很平稳，后半夜比前半夜还慢一些，和你平常差不多。今天宜做需要专心的事，午后可以闭目歇 15 分钟。',dev:'这三夜都过了子时才睡，静息心率比平常高一些。今天宜慢走、早睡，晚饭清淡些。',new:'今晚戴着睡，明早先告诉你睡了多久。第 7 天开始给元气分。',short:'昨晚只记录到 3 小时 20 分，少于 4 小时，不出元气分。',calib:'换了佩戴手指，元气约 2 周后稳定，先参考睡眠和活动。',sick:'这几天不计入基线，运动目标已暂停。多喝温水，早点睡。',offline:'设备 14 小时没同步，下面是昨天的数据。',lowbat:'昨夜睡得平稳。白天戴着充电约 40 分钟，别错过今晚的数据。'}[s];
  const whyG={normal:`元气 72 在你的平常范围 64–78，负荷适中，近 3 晚睡眠债 ${d.w}。`,dev:'静息心率连续 3 天高于平常（64，平常 56–61），HRV 39 毫秒，低于平常 41–55。',new:'今晚戴着睡，明早先看睡眠时长。第 7 天开始给元气分。',short:'昨晚只记录到 3 小时 20 分，少于 4 小时，不出元气分。',calib:'换了佩戴手指，元气约 2 周后稳定，先参考睡眠和活动。',sick:'这几天不计入基线，负荷目标已暂停。',offline:'设备 14 小时没同步，下面是昨天的数据。',lowbat:`元气 72，负荷适中。白天充电约 40 分钟，别错过今晚的数据。`}[s];
  const date=`<div class="between"><span class="sm mu">${y?'10月5日 周一 · 第 41 周':'10月5日 · 秋分第 13 天'}</span>${devChip()}</div>`;
  const auraBlock=`<div class="aurabox">${aura(y?180:170,vit==null?56:vit,load==null?3:load)}${auraKey()}</div>`;
  const chips=`<div class="hchips">
    <button class="chip" data-go="sleep">${ic('moon',15)} 睡眠 <b>${s==='short'?'3:20':'7:12'}</b>${y||s==='short'?'':' · 子时入睡'}</button>
    <button class="chip" data-go="activity">${ic('walk',15)} 活动 <b>${s==='sick'?'已暂停':'4,860'}</b>${s==='sick'?'':' 步'}</button>
   </div>`;
  if(y){
    const nw=s==='new'||s==='short';
    return `<section class="hero${aur?' aur':''}">
   ${date}
   <div class="sm" style="opacity:.85;text-shadow:var(--tsh)">${greet()}，小林</div>
   ${aur?auraBlock:''}
   <div class="hpair">
    <button class="hp" data-go="vitality"><span class="eb" style="color:var(--vit)">元气 · ${vSt}</span><span class="hn">${vN}</span>${aur?'':rbar(vit,64,78,50,92,'var(--vit)')}</button>
    <button class="hp" data-go="load"><span class="eb" style="color:var(--act)">负荷 · ${lSt}</span><span class="hn">${lN}</span>${aur?'':rbar(load,7,12,2,17,'var(--act)')}</button>
   </div>
   <div class="hstats">
    <button data-go="trend:hrv"><span class="k">HRV</span><span class="v">${nw?'—':s==='dev'?39:48}<small>毫秒</small></span></button>
    <button data-go="trend:rhr"><span class="k">静息心率</span><span class="v">${nw?'—':s==='dev'?64:58}<small>次/分</small></span></button>
    <button data-go="sleep"><span class="k">睡眠债</span><span class="v">${s==='new'?'—':d.t}</span></button>
   </div>
   <h1 class="hero-h">${conclusion()}</h1>
   <p class="why">${whyG}</p>
   <div class="grow"></div>
   ${chips}
  </section>`;
  }
  const tb=TIBA();
  return `<section class="hero">
   ${date}
   <div class="sm" style="opacity:.85;text-shadow:var(--tsh)">${greet()}，小林</div>
   ${tb?`<div class="htiba"><span class="seal">${tb}</span><span>寒露前三日</span></div>`:''}
   <h1 class="hero-h">${conclusion()}</h1>
   <p class="why">${whyY}</p>
   ${aur?auraBlock:''}
   <div class="ypair">
    <button data-go="vitality"><span class="eb" style="color:var(--vit)">元气 · ${vSt}</span><span class="n">${vN}</span></button>
    <button data-go="load"><span class="eb" style="color:var(--act)">负荷 · ${lSt}</span><span class="n">${lN}</span></button>
   </div>
   <p class="yi">依据：睡了 ${s==='short'?'3 小时 20 分':'7 小时 12 分'}${vit==null?'':' · 元气平常 64–78'} · 负荷平常 7–12 · 两项分开看</p>
   <div class="grow"></div>
   ${chips}
  </section>`;
}

function nightHR(){
  const W=330,H=124,pl=26,pr=6,pt=8,pb=20,iw=W-pl-pr,ih=H-pt-pb,r=rng(31),n=144,hr=[];let v=64;
  const deep=[[.08,.2],[.3,.37],[.47,.51]];
  for(let i=0;i<n;i++){const u=i/n,inDeep=deep.some(([a,b])=>u>=a&&u<b);v+=((inDeep?52:58-6*u)-v)*.12+(r()-.5)*2.2+(r()<.03?6:0);hr.push(v)}
  const X=i=>pl+i/(n-1)*iw,Y=x=>pt+(1-(x-44)/(80-44))*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="昨晚心率，深睡时段已标出">`;
  [50,60,70].forEach(t=>s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${pl-5}" y="${Y(t)+3.5}" font-size="9.5" text-anchor="end" fill="var(--mu)">${t}</text>`);
  deep.forEach(([a,b])=>s+=`<rect x="${pl+a*iw}" y="${pt}" width="${(b-a)*iw}" height="${ih}" fill="var(--slp)" fill-opacity=".16" rx="3"/>`);
  let d='';hr.forEach((x,i)=>d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1));
  s+=`<path d="${d}" fill="none" stroke="var(--mu)" stroke-width="1.3" stroke-linejoin="round"/>`;
  deep.forEach(([a,b])=>{let dd='';hr.forEach((x,i)=>{const u=i/n;if(u>=a&&u<b)dd+=(dd?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1)});s+=`<path d="${dd}" fill="none" stroke="var(--slp)" stroke-width="2.2" stroke-linejoin="round"/>`});
  [['23:28',0],['3:00',.48],['6:40',1]].forEach(([t,u],k)=>s+=`<text x="${pl+u*iw}" y="${H-5}" font-size="9.5" text-anchor="${k?k===2?'end':'middle':'start'}" fill="var(--mu)">${t}</text>`);
  return `<div class="between xs" style="margin-bottom:2px"><span class="mu">昨晚心率</span><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:color-mix(in srgb,var(--slp) 40%,transparent)"></i><span class="mu">深睡</span></span></div>`+s+'</svg><div style="height:10px"></div>';
}
function calendar(){
  const pat='aaabbaa abaaaba aaaabba aaab'.replace(/ /g,'');
  let s='<div class="cal" aria-label="近 4 周作息规律日历">';
  ['一','二','三','四','五','六','日'].forEach(d=>s+=`<span class="xs mu" style="text-align:center">${d}</span>`);
  for(let i=0;i<28;i++){const c=i<pat.length?(S.status==='new'&&i<27?'n':pat[i]):'n';s+=`<i class="${c}"></i>`}
  return s+'</div><div class="row xs mu" style="gap:14px;margin-top:8px"><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:50%;background:color-mix(in srgb,var(--tx) 14%,transparent)"></i>在平常时段入睡</span><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:50%;background:var(--slp)"></i>晚于平常 1 小时以上</span></div>';

P.sleep=()=>{const W=330,H=230,pl=34,top=20,rowH=14.5;const tY=h=>pl+(h-21)/13*(W-pl-10);
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="近 14 天入睡与起床时间">`;
  [21,24,27,30,33].forEach(h=>{svg+=`<line x1="${tY(h)}" x2="${tY(h)}" y1="${top-4}" y2="${H-18}" stroke="var(--line)"/><text x="${tY(h)}" y="${H-5}" font-size="10" text-anchor="middle" fill="var(--mu)">${(h%24)}:00</text>`});
  svg+=`<rect x="${tY(22.9)}" y="${top-4}" width="${tY(24.0)-tY(22.9)}" height="${H-top-14}" fill="var(--band)"/>`;
  D.sleepWin.forEach(([a,b],i)=>{const y=top+i*rowH;svg+=`<rect x="${tY(a)}" y="${y}" width="${tY(b)-tY(a)}" height="9" rx="4.5" fill="var(--slp)" fill-opacity="${a>24.2?.45:.9}"/>`;if(i%7===0)svg+=`<text x="${pl-6}" y="${y+8}" font-size="10" text-anchor="end" fill="var(--mu)">${i?'本周':'上周'}</text>`});
  svg+='</svg>';
  return{theme:'mo',night:1,html:`${nav('睡眠',{info:1})}<div class="pad stack">
  <div><h1 class="h1" style="font-size:24px">${S.status==='short'?'昨晚只记录到 3 小时 20 分':YG()?'睡了 7:12，比需要少 18 分钟':'子时入睡，卯时起，作息还算规律'}</h1><p class="sm mu" style="margin-top:6px">10 月 4 日夜${YG()||S.status==='short'?'':' · 周末两晚过了子时半才睡'}</p></div>
  ${YG()?`<div class="card"><div class="stats"><div class="stat"><div class="k">时长</div><div class="v num">${S.status==='short'?'3:20':'7:12'}</div></div><div class="stat"><div class="k">需要</div><div class="v num">7:30</div></div><div class="stat"><div class="k">近 3 晚睡眠债</div><div class="v num">${DEBT().t}</div></div></div>
   <p class="xs mu" style="margin-top:8px">入睡 23:28 · 起床 06:40 · 睡眠效率 91% · 需要的睡眠按近 90 天估算</p></div>`
  :`<div class="card"><div class="stats"><div class="stat"><div class="k">入睡</div><div class="v num">23:28</div><div class="xs mu">子时</div></div><div class="stat"><div class="k">起床</div><div class="v num">06:40</div><div class="xs mu">卯时</div></div><div class="stat"><div class="k">时长</div><div class="v num">${S.status==='short'?'3:20':'7:12'}</div></div></div>
   <p class="xs mu" style="margin-top:8px">你需要的睡眠约 7 小时 30 分 · 睡眠效率 91%</p></div>`}
  <div class="card"><div class="between"><span class="h3">作息规律</span><span class="chip vit">本周 5/7 晚在平常时段</span></div>
   <div style="margin-top:8px">${svg}</div><div class="xs mu">灰带是你平常的入睡时段 · 浅色为晚于平常 1 小时以上</div></div>
  <div class="card"><button class="between" data-act="stages" style="width:100%;background:none;border:0;color:inherit;font:inherit;cursor:pointer;padding:0;min-height:32px" aria-expanded="${S.stagesOpen}"><span class="h3">睡眠分期</span><span class="sm mu">${S.stagesOpen?'收起':'展开'}</span></button>
   ${S.stagesOpen?`<p class="xs mu" style="margin:6px 0 10px">穿戴设备的分期只能作大致参考。</p>${nightHR()}${[['清醒','18 分',8],['浅睡','3 小时 52 分',54],['深睡','1 小时 21 分',19],['快速眼动','1 小时 41 分',23]].map(([k,v,w])=>`<div style="margin-bottom:8px"><div class="between sm"><span>${k}</span><span class="num mu">${v}</span></div><div class="trk"><i style="width:${w}%;background:var(--slp)"></i></div></div>`).join('')}`:''}</div>
  <div class="card"><div class="h3">午休</div><p class="p sm mu" style="margin-top:4px">昨天 12:48 午休 22 分钟。</p></div></div>`}};

    adddev(){S.device=S.device==='ring'?'band':'ring';S.scan=0;S.stack=['me','device-choose'];render(true)},
    unbind(){openSheet(`<div class="h2">解除绑定${devName()}？</div><p class="p sm mu" style="margin:8px 0 16px">已同步的数据会保留。重新绑定后需要约 2 周校准。</p><button class="btn" data-act="closesheet">取消</button><button class="btn ghost" data-act="closesheet" style="margin-top:10px;color:var(--alr)">解除绑定</button>`)},
    del(){openSheet(`<div class="h2">删除账号和全部数据？</div><p class="p sm mu" style="margin:8px 0 16px">删除后 7 天内可以撤回，之后不可恢复。家人共享会同时停止。</p><button class="btn" data-act="closesheet">取消</button><button class="btn ghost" data-act="closesheet" style="margin-top:10px;color:var(--alr)">删除</button>`)},
    closesheet(){const s=$('.sheet-bg');s&&s.remove()},
    how(){go('how')},
    stages(){S.stagesOpen=!S.stagesOpen;render()},
    tper(){S.trend.p=v;render()},
    tmetric(){openSheet(`<div class="h2" style="margin:0 4px 6px">选择指标</div><div class="list">${TORDER.map(k=>`<button class="li" data-act="tpick" data-v="${k}"><span class="ic" style="color:${TM[k].c}">${ic(TM[k].ic)}</span><span class="t">${TM[k].n}</span>${k===S.trend.m?`<span style="color:var(--vit)">${ic('check',18,2.2)}</span>`:''}</button>`).join('')}</div>`)},
    tpick(){S.trend.m=v;const sb=$('.sheet-bg');sb&&sb.remove();render(true)},
    ask(){ask(+v);render();const sc=$('#scroll');sc.scrollTop=sc.scrollHeight},
  };
  A[a]&&A[a]();
});
function openSheet(html){const d=document.createElement('div');d.className='sheet-bg';d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;d.addEventListener('click',e=>{if(e.target===d)d.remove()});$('#app').appendChild(d)}

/* 评审面板 */
const IDX={on:[['splash','启动页 · 呼吸'],['splash2','启动页 · 依次点亮'],['welcome','欢迎'],['login','登录'],['mode','选模式'],['packs','内容包'],['device-choose','选设备'],['wear','佩戴方式'],['scan','搜索'],['pair','配对'],['perms','权限'],['baseline','建立基线']],
 tab:TABS.map(t=>[t[0],t[1]]),
 det:[['vitality','元气'],['load','负荷'],['oxygen','夜间呼吸与血氧'],['sleep','睡眠'],['activity','活动'],['alert','偏离提醒'],['how','如何计算'],['bodyage','身体年龄'],['hrv','心率与 HRV'],['trend','统一趋势'],['breathe','1 分钟呼吸'],['vera','问 Vera'],['member','家人详情'],['invite','邀请家人'],['device','设备'],['sources','数据来源'],['privacy','隐私与数据'],['lab','实验室'],['records','健康档案'],['report','体检报告'],['bp','血压'],['glucose','血糖'],['visit','复诊一页纸'],['weekly','周报'],['half','节气报 / 半月报'],['widgets','桌面小组件'],['vip','元气+ 会员']]};
['on','tab','det'].forEach(g=>{$('#idx-'+g).innerHTML=IDX[g].map(([k,t])=>`<button data-j="${k}">${t}</button>`).join('')});
$('#ctl-dir').innerHTML=[['A','A 时令卡片'],['C','C 简洁视图']].map(([k,t])=>`<button data-dir="${k}">${t}</button>`).join('');
$('#ctl-status').innerHTML=STATUS.map(([k,t])=>`<button data-st="${k}">${t}</button>`).join('');
$('#ctl-mode').innerHTML=[['yang','养生'],['young','青年']].map(([k,t])=>`<button data-mode="${k}">${t}</button>`).join('');
$('#ctl-viz').innerHTML=[['num','两个数字'],['aura','青绸光漩'],['ink','泼彩光漩']].map(([k,t])=>`<button data-viz="${k}">${t}</button>`).join('');
$('#ctl-dev').innerHTML=[['ring','戒指'],['band','手环']].map(([k,t])=>`<button data-dev="${k}">${t}</button>`).join('');
document.querySelector('.panel').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.j)jump(b.dataset.j);
  if(b.dataset.dir){S.dir=b.dataset.dir;if(!['today'].includes(cur()))S.stack=['today'];render(true)}
  if(b.dataset.st){S.status=b.dataset.st;if(!['today','body','vitality','oxygen','sleep','device','me','plan','alert'].includes(cur()))S.stack=['today'];if(S.status==='dev'&&cur()==='alert'){}render()}
  if(b.dataset.dev){S.device=b.dataset.dev;render()}
  if(b.dataset.mode){S.mode=b.dataset.mode;render()}
  if(b.dataset.viz){S.viz=b.dataset.viz;if(cur()!=='today')S.stack=['today'];render(true)}
});
function syncPanel(){
  document.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dir===S.dir));
  document.querySelectorAll('[data-st]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.st===S.status));
  document.querySelectorAll('[data-dev]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.dev===S.device));
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===S.mode));
  document.querySelectorAll('[data-viz]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.viz===(S.viz||'num')));
  const c=cur();document.querySelectorAll('[data-j]').forEach(b=>b.classList.toggle('on',b.dataset.j===c));
}
const start=location.hash.slice(1);
if(start&&(P[start]))jump(start);else{S.stack=['splash'];render(true)}
resizeSky();syncTime();requestAnimationFrame(loop);
})();
