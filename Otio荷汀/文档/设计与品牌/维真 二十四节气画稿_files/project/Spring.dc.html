.nm{font-family:'Noto Serif SC',serif;font-size:44px;font-weight:700;line-height:1.1}

.cy{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700}

<div style="width: 1240px; height: 2400px; box-sizing: border-box; padding: 56px 48px; background: #F4F1EA; color: #1F2A2E; font-family: 'Noto Sans SC', sans-serif">

<div style="font-family: 'Noto Serif SC', serif; font-size: 22px">上海</div>
<div style="font-family: 'Noto Serif SC', serif; font-size: 22px">北京</div>
<div style="font-family: 'Noto Serif SC', serif; font-size: 22px">新加坡</div>
</div>

<div class="row">
<div><div class="nm">立春</div><div class="dt">2月4日前后</div><div class="hou">东风解冻<br>蛰虫始振<br>鱼陟负冰</div></div>
<figure><img src="/_blob/c158f5d34871bd8f820e0bce7632c24a" alt="上海立春：蜡梅"><figcaption><div class="tx">蜡梅开在光枝上，金黄细碎</div><div class="cl">缃色 · 墨</div></figcaption></figure>
<figure><img src="/_blob/f11dfdd3eff0b6807fd811a5cc6ac07a" alt="北京立春：冰面初裂"><figcaption><div class="tx">护城河冰面初裂，柳枝还没青</div><div class="cl">月白 · 墨</div></figcaption></figure>
<figure><img src="/_blob/1f1d8c29c9419219ab0c9e5b2f303525" alt="新加坡立春：年橘"><figcaption><div class="tx">东北季风的晴风，家家门口摆年橘</div><div class="cl">橘色 · 竹青</div></figcaption></figure>
</div>

<div class="row">
<div><div class="nm">雨水</div><div class="dt">2月18日前后</div><div class="hou">獭祭鱼<br>候雁北<br>草木萌动</div></div>
<figure><img src="/_blob/e029756e9c0c16a0688772cdce5db2a5" alt="上海雨水：梅花细雨"><figcaption><div class="tx">梅花粉白，细雨斜着落</div><div class="cl">藕荷 · 墨</div></figcaption></figure>
<figure><img src="/_blob/42deda09a98f89437a0c8ac013b021d3" alt="北京雨水：柳梢残雪"><figcaption><div class="tx">柳梢泛出一点青，背阴处还有残雪</div><div class="cl">柳黄 · 月白</div></figcaption></figure>
<figure><img src="/_blob/915b6c4e9f192e7ca922926508b9c3ce" alt="新加坡雨水：风筝"><figcaption><div class="tx">一年里最干爽的几周，滨海堤坝放风筝</div><div class="cl">天青 · 朱</div></figcaption></figure>
</div>

<div class="row">
<div><div class="nm">惊蛰</div><div class="dt">3月5日前后</div><div class="hou">桃始华<br>仓庚鸣<br>鹰化为鸠</div></div>
<figure><img src="/_blob/9b27b77167b0008e5b91526471973012" alt="上海惊蛰：白玉兰春雷"><figcaption><div class="tx">白玉兰开了，远处第一声春雷</div><div class="cl">玉白 · 墨</div></figcaption></figure>
<figure><img src="/_blob/13c2ebf88a948874e07be1202fade660" alt="北京惊蛰：柳芽春风"><figcaption><div class="tx">柳芽新绿，春风大，带一点沙　★待核</div><div class="cl">柳绿 · 黄埃</div></figcaption></figure>
<figure><img src="/_blob/100d8e02d236fcde1b4456afc4611e20" alt="新加坡惊蛰：黄花风铃木雷雨"><figcaption><div class="tx">季风转换，午后雷雨；黄花风铃木开满枝</div><div class="cl">缃色 · 黛</div></figcaption></figure>
</div>

<div class="row">
<div><div class="nm">春分</div><div class="dt">3月20日前后</div><div class="hou">玄鸟至<br>雷乃发声<br>始电</div></div>
<figure><img src="/_blob/e3f7111de9270dd095177188df376431" alt="上海春分：樱花燕子"><figcaption><div class="tx">樱花开，燕子回来</div><div class="cl">桃红 · 墨</div></figcaption></figure>
<figure><img src="/_blob/543bf952245aebd4d2da3ebbfb47811b" alt="北京春分：玉兰燕子"><figcaption><div class="tx">颐和园的玉兰开了</div><div class="cl">玉白 · 黛</div></figcaption></figure>
<figure><img src="/_blob/3ea5b1a897ed5a60af9de65f9668d723" alt="新加坡春分：风铃木落英"><figcaption><div class="tx">风铃木落英铺地，午后雷雨</div><div class="cl">缃色 · 黛</div></figcaption></figure>
</div>

<div class="row">
<div><div class="nm">清明</div><div class="dt">4月5日前后</div><div class="hou">桐始华<br>田鼠化为鴽<br>虹始见</div></div>
<figure><img src="/_blob/364931ecb5193636190cbef62e1a1871" alt="上海清明：柳丝细雨"><figcaption><div class="tx">柳丝垂水，细雨不停</div><div class="cl">柳绿 · 烟灰</div></figcaption></figure>
<figure><img src="/_blob/dc67aa239ea9083397674ba950265fbc" alt="北京清明：桃花"><figcaption><div class="tx">桃花杏花一起开</div><div class="cl">桃红 · 墨</div></figcaption></figure>
<figure><img src="/_blob/c74d03c2ecd3618e20b772a08c364c31" alt="新加坡清明：雨树雷雨"><figcaption><div class="tx">雨树撑开大伞，雷雨说来就来</div><div class="cl">竹青 · 黛</div></figcaption></figure>
</div>

<div class="row">
<div><div class="nm">谷雨</div><div class="dt">4月20日前后</div><div class="hou">萍始生<br>鸣鸠拂其羽<br>戴胜降于桑</div></div>
<figure><img src="/_blob/ae2b1565eeee3652cbcdfbe0128ef8ea" alt="上海谷雨：雨前新茶"><figcaption><div class="tx">雨前新茶，嫩芽带水</div><div class="cl">茶绿 · 墨</div></figcaption></figure>
<figure><img src="/_blob/10555d5d96cc4361185bb121336b49ff" alt="北京谷雨：牡丹柳絮"><figcaption><div class="tx">景山牡丹开，杨柳絮满天</div><div class="cl">胭脂 · 月白</div></figcaption></figure>
<figure><img src="/_blob/e5fd4ce80910d9ec09a26cb0c9138761" alt="新加坡谷雨：鸡蛋花"><figcaption><div class="tx">鸡蛋花一年到头开，雨后最香</div><div class="cl">象牙 · 缃色</div></figcaption></figure>
</div>
</div>
