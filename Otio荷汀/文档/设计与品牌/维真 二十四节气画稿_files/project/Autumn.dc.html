<style>

.row{display:grid;grid-template-columns:200px repeat(3,minmax(0,1fr));gap:24px;padding:26px 0;border-top:1px solid #CFC8B8}
.nm{font-family:'Noto Serif SC',serif;font-size:44px;font-weight:700;line-height:1.1}

<div style="font-family: 'Noto Serif SC', serif; font-size: 64px; font-weight: 700; color: #9A6A2E">秋</div>
<div style="font-family: 'Noto Serif SC', serif; font-size: 22px">上海</div>
<div style="font-family: 'Noto Serif SC', serif; font-size: 22px">北京</div>
<div style="font-family: 'Noto Serif SC', serif; font-size: 22px">新加坡</div>
</div>

<div class="row">
<div><div class="nm">立秋</div><div class="dt">8月7日前后</div><div class="hou">凉风至<br>白露降<br>寒蝉鸣</div></div>
<figure><img src="/_blob/c83d3509eab4f0840c9a0843e2e0ea8e" alt="上海立秋：梧桐浓荫"><figcaption><div class="tx">秋老虎还在，梧桐浓荫</div><div class="cl">竹青 · 墨</div></figcaption></figure>
<figure><img src="/_blob/885fa069f2483e71c1f953092ac571cc" alt="北京立秋：荷叶渐老"><figcaption><div class="tx">早晚有了凉风，荷叶开始老</div><div class="cl">苍绿 · 秋香</div></figcaption></figure>
<figure><img src="/_blob/a7789025e75bc5433757c16b6c93a369" alt="新加坡立秋：风铃木二度花"><figcaption><div class="tx">风铃木第二次开花</div><div class="cl">缃色 · 竹青</div></figcaption></figure>
</div>

<div class="row">
<div><div class="nm">处暑</div><div class="dt">8月23日前后</div><div class="hou">鹰乃祭鸟<br>天地始肃<br>禾乃登</div></div>
<figure><img src="/_blob/15d1629f7198c2a4576d41d32c507ec3" alt="上海处暑：台风雨"><figcaption><div class="tx">台风雨，风一阵雨一阵</div><div class="cl">黛 · 竹青</div></figcaption></figure>
<figure><img src="/_blob/dd6f90d6cfab596269fcfd2b6887ca3c" alt="北京处暑：蜻蜓"><figcaption><div class="tx">天一下子高了，蜻蜓低飞</div><div class="cl">天青 · 秋香</div></figcaption></figure>
<figure><img src="/_blob/270dcb986c64de131651df1340cdfa27" alt="新加坡处暑：烟霾雨树"><figcaption><div class="tx">偶有烟霾，雨树叶子合起来</div><div class="cl">竹青 · 黄埃</div></figcaption></figure>
</div>

<div class="row">
<div><div class="nm">白露</div><div class="dt">9月7日前后</div><div class="hou">鸿雁来<br>玄鸟归<br>群鸟养羞</div></div>
<figure><img src="/_blob/a75d100a7d4e2249f0326b97eb99a378" alt="上海白露：芦苇清露"><figcaption><div class="tx">芦苇抽穗，清晨有露</div><div class="cl">芦灰 · 月白</div></figcaption></figure>
<figure><img src="/_blob/061f7ad61cd7fc99e510076d8ac4ae7c" alt="北京白露：枣红"><figcaption><div class="tx">枣红了，草尖挂露</div><div class="cl">枣红 · 竹青</div></figcaption></figure>
<figure><img src="/_blob/81c3cc373722f28bea6d7dcc397dae90" alt="新加坡白露：中秋灯笼"><figcaption><div class="tx">中秋将近，牛车水挂满灯笼　★日期浮动</div><div class="cl">朱 · 缃色</div></figcaption></figure>
</div>

<div class="row">
<div><div class="nm">秋分</div><div class="dt">9月23日前后</div><div class="hou">雷始收声<br>蛰虫坯户<br>水始涸</div></div>
<figure><img src="/_blob/a154188e01c3f7108f9a077949f511ca" alt="上海秋分：桂花"><figcaption><div class="tx">桂花开了，一路甜香</div><div class="cl">缃色 · 竹青</div></figcaption></figure>
<figure><img src="/_blob/0b033e1e0453f2139da7585b2b528bb3" alt="北京秋分：银杏初黄"><figcaption><div class="tx">天最高最蓝，银杏初黄</div><div class="cl">秋香 · 天青</div></figcaption></figure>
<figure><img src="/_blob/0346108f6bb953b1af6e3af278963281" alt="新加坡秋分：雨树雷雨"><figcaption><div class="tx">季风间歇期，午后雷雨，雨树撑伞</div><div class="cl">竹青 · 黛</div></figcaption></figure>
</div>

<div class="row">
<div><div class="nm">寒露</div><div class="dt">10月8日前后</div><div class="hou">鸿雁来宾<br>雀入大水为蛤<br>菊有黄华</div></div>
<figure><img src="/_blob/cc8f2c5329dd4813665067b082777c45" alt="上海寒露：菊花"><figcaption><div class="tx">菊有黄华，桂花尾声</div><div class="cl">缃色 · 墨</div></figcaption></figure>
<figure><img src="/_blob/3cea9024f49d10c1e85d2749625e0ba8" alt="北京寒露：红叶初染"><figcaption><div class="tx">香山红叶初染，雁南飞</div><div class="cl">赭石 · 竹青</div></figcaption></figure>
<figure><img src="/_blob/d810ea9f45846ac17db98f4ace2b93c1" alt="新加坡寒露：雨树"><figcaption><div class="tx">雷雨仍多，雨后凉快</div><div class="cl">竹青 · 黛</div></figcaption></figure>
</div>

<div class="row">
<div><div class="nm">霜降</div><div class="dt">10月23日前后</div><div class="hou">豺乃祭兽<br>草木黄落<br>蛰虫咸俯</div></div>
<figure><img src="/_blob/0c3bb591df0a4d70c74b68b7ee15e438" alt="上海霜降：梧桐黄落"><figcaption><div class="tx">梧桐叶黄落</div><div class="cl">秋香 · 墨</div></figcaption></figure>
<figure><img src="/_blob/5b4da07bef1ba1e5a38339b848bf2b0e" alt="北京霜降：红叶柿子"><figcaption><div class="tx">香山红叶正当时，柿子挂枝</div><div class="cl">朱 · 柿橙</div></figcaption></figure>
<figure><img src="/_blob/8cf5ad4a51f72b935d7d16b4c5057b3c" alt="新加坡霜降：鸡蛋花雨"><figcaption><div class="tx">没有霜，雨水渐多，鸡蛋花被雨打落</div><div class="cl">象牙 · 黛</div></figcaption></figure>
</div>
</div>
