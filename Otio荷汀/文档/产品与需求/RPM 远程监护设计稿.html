<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>RPM 远程监护设计稿 (Copy)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: sticky top bar with three views (spec document / clinic web portal in a desktop frame / patient app in a phone frame). Clinical teal on cool grey-green neutrals; semantic red/amber/green reserved for alert state. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --surface2:#E8EEEC; --fg:#14201E; --muted:#596966; --line:#D3DCD9;
  --accent:#0B6E69; --accent-ink:#FFFFFF; --accent-soft:#D6EBE8;
  --crit:#B83227; --crit-soft:#F8E1DE; --warn:#9A6411; --warn-soft:#F7EBD3; --ok:#2B7A4B; --ok-soft:#DDF0E3; --info:#35589C; --info-soft:#E0E8F7;
  --sys:#B83227; --dia:#35589C; --cgm:#0B6E69; --band:rgba(43,122,75,.12);
  --ecg-bg:#FFF6F5; --ecg-minor:#F6D3D0; --ecg-major:#EBA9A3; --ecg-line:#1D1D1D;
  --phone:#0E1413; --shadow:0 1px 2px rgba(20,32,30,.06),0 8px 24px rgba(20,32,30,.07);
  --f-sans:"IBM Plex Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1514; --surface:#162120; --surface2:#1D2A28; --fg:#E2EBE9; --muted:#93A6A2; --line:#2B3B38;
  --accent:#4FB5AC; --accent-ink:#06201E; --accent-soft:#1A3533;
  --crit:#E8705F; --crit-soft:#3A1F1C; --warn:#E0AA4E; --warn-soft:#352A16; --ok:#62C08A; --ok-soft:#173022; --info:#86A3E3; --info-soft:#1C2740;
  --sys:#E8705F; --dia:#86A3E3; --cgm:#4FB5AC; --band:rgba(98,192,138,.13);
  --ecg-bg:#1B1716; --ecg-minor:#3A2725; --ecg-major:#5A3532; --ecg-line:#F1E6E4;
  --phone:#000; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1514; --surface:#162120; --surface2:#1D2A28; --fg:#E2EBE9; --muted:#93A6A2; --line:#2B3B38;
  --accent:#4FB5AC; --accent-ink:#06201E; --accent-soft:#1A3533;
  --crit:#E8705F; --crit-soft:#3A1F1C; --warn:#E0AA4E; --warn-soft:#352A16; --ok:#62C08A; --ok-soft:#173022; --info:#86A3E3; --info-soft:#1C2740;
  --sys:#E8705F; --dia:#86A3E3; --cgm:#4FB5AC; --band:rgba(98,192,138,.13);
  --ecg-bg:#1B1716; --ecg-minor:#3A2725; --ecg-major:#5A3532; --ecg-line:#F1E6E4;
  --phone:#000; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[data-act]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{padding-inline:16px;padding-block:20px 48px;max-width:1280px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;gap:12px 20px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;margin-right:auto;min-width:0}
.mark{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px}
.brand b{display:block;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:12px}
.seg{display:inline-flex;background:var(--surface2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.example{display:inline-block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:99px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.info{background:var(--info-soft);color:var(--info)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.dotc{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}

/* spec */
.spec{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px}
.toc{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:2px;font-size:13px}
.toc a{color:var(--muted);text-decoration:none;padding:5px 10px;border-radius:6px}
.toc a:hover{background:var(--surface2);color:var(--fg)}
.doc{min-width:0;display:flex;flex-direction:column;gap:36px}
.doc section{display:flex;flex-direction:column;gap:12px;scroll-margin-top:80px}
.doc h1{font-size:28px;line-height:1.25}
.doc h2{font-size:20px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.doc h3{font-size:15px}
.doc p{margin:0;max-width:72ch;color:var(--fg)}
.lede{color:var(--muted);font-size:15px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;background:var(--surface2);white-space:nowrap}
tr:last-child td{border-bottom:0}
.tag-new{color:var(--accent);font-weight:600}
.tag-ref{color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;counter-increment:s;display:flex;flex-direction:column;gap:4px}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;color:var(--accent)}
.steps b{font-size:14px} .steps span{font-size:12.5px;color:var(--muted)}
.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:stretch}
.arch .col{display:flex;flex-direction:column;gap:8px}
.arch .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.box b{display:block;font-size:13.5px}
.box small{color:var(--muted);font-size:12px;display:block}
.box.hl{border-color:var(--accent);background:var(--accent-soft)}
.flow-note{font-size:12.5px;color:var(--muted)}
code{font-family:var(--f-mono);font-size:.92em;background:var(--surface2);padding:1px 5px;border-radius:4px}
.orgsw{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--surface2);border-radius:9px;padding:3px;margin:0 2px 12px}
.orgsw button{border:0;background:transparent;padding:6px 2px;border-radius:7px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.orgsw button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;display:inline-block;flex:none;vertical-align:middle}.sw::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--accent)}.sw.on::after{left:16px}
.perm td{text-align:center}.perm td:first-child{text-align:left}
.qrow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}.qrow .h{color:var(--muted);cursor:grab;font-family:var(--f-mono)}
.hbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}.hbar i{display:block;height:100%;background:var(--accent);border-radius:4px}.hrow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,2fr) 64px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.plan .pr{font-family:var(--f-mono);font-size:20px;font-weight:600}.plan .pr small{font-size:12px;color:var(--muted);font-weight:400}
.plan ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--muted)}
.split{display:flex;flex-direction:column;gap:4px;font-size:13px}.split div{display:flex;justify-content:space-between;gap:10px}.split div.tot{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.stepper{display:flex;gap:4px}.stepper i{flex:1;height:5px;border-radius:3px;background:var(--surface2)}.stepper i.on{background:var(--accent)}
.callout{border-left:3px solid var(--accent);background:var(--surface);padding:12px 14px;border-radius:0 10px 10px 0;max-width:80ch}
.qlist{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
.states{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.states .arrow{color:var(--muted)}

/* clinic frame */
.frame{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.frame-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface2);font-size:12px;color:var(--muted)}
.frame-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.frame-bar .url{margin-left:8px;background:var(--surface);padding:2px 10px;border-radius:6px;font-family:var(--f-mono);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.portal{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:640px}
.side{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface)}
.side .org{padding:4px 10px 14px;font-size:12px;color:var(--muted)}
.side .org b{display:block;color:var(--fg);font-size:14px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:13.5px;white-space:nowrap}
.nav:hover{background:var(--surface2);color:var(--fg)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--crit);color:#fff;border-radius:99px;padding:0 6px;font-family:var(--f-mono)}
.nav svg{width:16px;height:16px;flex:none}
.pmain{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;background:var(--bg)}
.phead{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.phead h2{font-size:19px;margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi small{color:var(--muted);font-size:12px;display:block}
.kpi .v{font-size:26px;font-weight:600;font-family:var(--f-mono);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .d{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h h3{font-size:14px;margin-right:auto}
.panel-b{padding:12px 14px}
.panel .tbl-wrap{border:0;border-radius:0 0 10px 10px}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
.sev{display:inline-block;width:4px;height:28px;border-radius:2px;vertical-align:middle;margin-right:8px}
.sev.crit{background:var(--crit)} .sev.warn{background:var(--warn)} .sev.info{background:var(--info)}
.pname{font-weight:600}
.sub{color:var(--muted);font-size:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;color:var(--fg);min-width:0}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;width:70px;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.ptitle{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none}
.ptitle .meta{display:flex;flex-direction:column;gap:3px;margin-right:auto;min-width:0}
.ptitle .meta b{font-size:17px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.ptabs button{border:0;background:transparent;padding:8px 12px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.vitals{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.vital{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.vital small{color:var(--muted);font-size:12px}
.vital .v{font-family:var(--f-mono);font-size:20px;font-weight:500}
.vital .v u{text-decoration:none;font-size:11px;color:var(--muted);margin-left:3px}
.vital .src{font-size:11px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:10px;font-family:var(--f-mono)}
.chart .band{fill:var(--band)}
.chart .ln{stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.sys{stroke:var(--sys)} .chart .ln.dia{stroke:var(--dia)} .chart .ln.cgm{stroke:var(--cgm)} .chart .ln.hr{stroke:var(--info)}
.chart .dot.sys,.chart .end.sys{fill:var(--sys)} .chart .dot.dia,.chart .end.dia{fill:var(--dia)} .chart .end.cgm{fill:var(--cgm)} .chart .end.hr{fill:var(--info)}
.chart .end{stroke:var(--surface);stroke-width:2}
.chart .ref{stroke-dasharray:4 4;stroke-width:1}
.chart .ref.crit{stroke:var(--crit)} .chart .ref.warn{stroke:var(--warn)}
.chart .lbl{font-size:10px;font-family:var(--f-mono)}
.chart .lbl.crit{fill:var(--crit)} .chart .lbl.warn{fill:var(--warn)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:middle;margin-right:4px}
.tir{display:flex;height:16px;border-radius:4px;overflow:hidden}
.tir i{display:block;height:100%}
.tir-l{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:11px;color:var(--muted);margin-top:6px}
.tir-l b{display:block;font-family:var(--f-mono);font-size:13px;color:var(--fg)}
.ecg{border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.timeline{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.timeline li{display:grid;grid-template-columns:96px 14px minmax(0,1fr);gap:10px;padding-bottom:14px}
.timeline .t{font-size:12px;color:var(--muted);text-align:right}
.timeline .rail{position:relative}
.timeline .rail::before{content:"";position:absolute;left:6px;top:4px;bottom:-14px;width:2px;background:var(--line)}
.timeline li:last-child .rail::before{display:none}
.timeline .rail::after{content:"";position:absolute;left:2px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline .c{display:flex;flex-direction:column;gap:3px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kcol{background:var(--surface2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kcol h4{margin:0;font-size:13px;display:flex;gap:6px;align-items:center}
.kcol h4 .num{color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .who{font-weight:600;margin-right:auto}
.tpl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tpl .panel-b{display:flex;flex-direction:column;gap:6px;font-size:13px}
.tpl ol{margin:0;padding-left:18px;color:var(--muted);font-size:12.5px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,16,15,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(640px,100%);max-height:calc(100% - 32px);overflow:auto;box-shadow:var(--shadow)}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal .mh h3{margin-right:auto;font-size:16px}
.modal .mb{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;min-width:0}
.field.full{grid-column:1/-1}
.field>span{color:var(--muted);font-size:12px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts label{border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:13px;display:flex;gap:5px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--accent);margin:0}
textarea.input{resize:vertical;min-height:64px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:13px;box-shadow:var(--shadow)}

/* patient app */
.appwrap{display:grid;grid-template-columns:220px auto minmax(0,1fr);gap:28px;align-items:start}
.screens{display:flex;flex-direction:column;gap:2px}
.screens h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 10px 4px}
.screens .nav{width:100%}
.notes{display:flex;flex-direction:column;gap:12px;min-width:0}
.notes .box p{margin:4px 0 0;color:var(--muted);font-size:13px}
.phone{width:340px;max-width:100%;height:720px;border-radius:44px;background:var(--phone);padding:10px;box-shadow:var(--shadow)}
.phone.android{border-radius:30px}
.scr{height:100%;border-radius:36px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.phone.android .scr{border-radius:22px}

/* ---------- charts ---------- */
function lineChart(o){
 const w=o.w,h=o.h,p={l:34,r:20,t:10,b:22};
 const X=x=>p.l+(x-o.x0)/(o.x1-o.x0)*(w-p.l-p.r), Y=y=>p.t+(1-(y-o.y0)/(o.y1-o.y0))*(h-p.t-p.b);
 let s=`<svg viewBox="0 0 ${w} ${h}" class="chart" role="img" aria-label="${esc(o.label||'')}">`;
 if(o.band)s+=`<rect x="${p.l}" y="${Y(o.band[1])}" width="${w-p.l-p.r}" height="${Y(o.band[0])-Y(o.band[1])}" class="band"/>`;
 o.yt.forEach(v=>s+=`<line x1="${p.l}" x2="${w-p.r}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${p.l-6}" y="${Y(v)+3}" text-anchor="end" class="tick">${v}</text>`);
 o.xt.forEach(([x,l])=>s+=`<text x="${X(x)}" y="${h-6}" text-anchor="middle" class="tick">${l}</text>`);
 (o.refs||[]).forEach(([v,c,l])=>s+=`<line x1="${p.l}" x2="${w-p.r}" y1="${Y(v)}" y2="${Y(v)}" class="ref ${c}"/><text x="${w-p.r-2}" y="${Y(v)-3}" text-anchor="end" class="lbl ${c}">${l}</text>`);
 o.series.forEach(se=>{
  const d=se.pts.map(([x,y],i)=>(i?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)).join('');
  s+=`<path d="${d}" class="ln ${se.c}" fill="none"/>`;
  if(se.dots)se.pts.forEach(([x,y])=>s+=`<circle cx="${X(x).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="2.4" class="dot ${se.c}"/>`);
  const [lx,ly]=se.pts[se.pts.length-1];s+=`<circle cx="${X(lx).toFixed(1)}" cy="${Y(ly).toFixed(1)}" r="4" class="end ${se.c}"/>`;
 });
 return s+'</svg>';
}

function cgmVal(t){return 6.1+4.3*Math.exp(-((t-8.3)**2)/.8)+5.0*Math.exp(-((t-12.9)**2)/1.1)+4.5*Math.exp(-((t-19.1)**2)/1.0)-2.7*Math.exp(-((t-3.3)**2)/.9)+.25*Math.sin(t*2.3)}
function cgmChart(w,h){
 const pts=[];for(let t=0;t<=24;t+=.25)pts.push([t,+cgmVal(t).toFixed(2)]);
 return lineChart({w,h,x0:0,x1:24,y0:2,y1:16,yt:[3.9,7,10,13.9],xt:[[0,'00:00'],[6,'06:00'],[12,'12:00'],[18,'18:00'],[24,'24:00']],band:[3.9,10],
  label:L('24 小时 CGM 曲线','24-hour CGM trace'),series:[{c:'cgm',pts}]});
}
function hrChart(w,h){
 const pts=[];for(let t=0;t<=24;t+=.5){let v=64+10*Math.sin((t-9)/24*Math.PI*2)+(t>7&&t<8?18:0)+(t>18&&t<19?12:0)+3*Math.sin(t*3.1);pts.push([t,+v.toFixed(0)])}
 return lineChart({w,h,x0:0,x1:24,y0:40,y1:110,yt:[50,70,90],xt:[[0,'00:00'],[12,'12:00'],[24,'24:00']],label:L('心率','Heart rate'),series:[{c:'hr',pts}]});
}
function tirBar(){
 const seg=[[1,'#7a1f17',['<3.0','<3.0']],[3,'var(--crit)',['3.0–3.8','3.0–3.8']],[72,'var(--ok)',['3.9–10.0','3.9–10.0']],[18,'var(--warn)',['10.1–13.9','10.1–13.9']],[6,'#8a4f0a',['>13.9','>13.9']]];
 return `<div class="tir" role="img" aria-label="TIR 72%">${seg.map(([p,c])=>`<i style="width:${p}%;background:${c}"></i>`).join('')}</div>
 <div class="tir-l">${seg.map(([p,c,l])=>`<div><b>${p}%</b>${T(l)}</div>`).join('')}</div>`;
}
function ecgStrip(w,h,af){
 let rnd=7;const r=()=>{rnd=(rnd*9301+49297)%233280;return rnd/233280};
 const sec=6,sps=200,beats=[];let t=.3;while(t<sec){beats.push(t);t+=af?.42+r()*.75:.82}
 const g=(x,m,s,a)=>a*Math.exp(-((x-m)**2)/(2*s*s));
 const pts=[];for(let i=0;i<=sec*sps;i++){const x=i/sps;let y=0;
  beats.forEach(b=>{const d=x-b;if(d>-.3&&d<.6){if(!af)y+=g(d,-.16,.025,.12);y+=g(d,-.03,.01,-.12)+g(d,0,.012,1)+g(d,.03,.012,-.25)+g(d,.24,.05,.28)}});
  if(af)y+=.03*Math.sin(x*38+r()*.6);pts.push([x,y])}
 const X=x=>x/sec*w,Y=y=>h*.62-y*h*.5;
 const d=pts.map(([x,y],i)=>(i?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1)).join('');
 let gr='';const mm=w/(sec*25);
 for(let i=0;i*mm<=w;i++)gr+=`<line x1="${(i*mm).toFixed(1)}" x2="${(i*mm).toFixed(1)}" y1="0" y2="${h}" stroke="var(${i%5?'--ecg-minor':'--ecg-major'})" stroke-width="${i%5?.5:1}"/>`;
 for(let j=0;j*mm<=h;j++)gr+=`<line y1="${(j*mm).toFixed(1)}" y2="${(j*mm).toFixed(1)}" x1="0" x2="${w}" stroke="var(${j%5?'--ecg-minor':'--ecg-major'})" stroke-width="${j%5?.5:1}"/>`;
 return `<svg viewBox="0 0 ${w} ${h}" class="chart ecg" role="img" aria-label="ECG"><rect width="${w}" height="${h}" fill="var(--ecg-bg)"/>${gr}<path d="${d}" fill="none" stroke="var(--ecg-line)" stroke-width="1.3" stroke-linejoin="round"/><text x="6" y="${h-6}" font-size="8" font-family="var(--f-mono)" fill="var(--muted)">25 mm/s · 10 mm/mV · Lead I</text></svg>`;
}

 <section id="biz"><h2>${L('计划、支付与结算','Plans, payments and fees')}</h2>
  <p>${L('按调整后的商业模式：主要由患者按月付费购买监测计划；诊所负责开计划和临床服务，按实际提供的服务拿固定服务费；体检中心按批发价采购 14 天检查套装；平台集中护士团队承担日常审阅。门户顶部可切换“诊所 / 体检中心 / 平台运营”三种视图。',
  'Per the revised business model: patients mainly pay monthly for a care plan; clinics start plans and provide clinical services, earning a fixed fee for services delivered; screening centres buy 14-day check kits at wholesale; a central nurse team handles daily review. Switch between the Clinic, Screening and Operations views at the top of the portal.')}</p>
  ${tbl([L('模块','Module'),L('功能','Features'),L('使用方','Used by'),L('优先级','Priority')],[
   [`<b>${L('计划目录与定价','Plan catalogue & pricing')}</b>`,L('计划内容、患者价、诊所服务费率（按审阅分工两档）、最短期限、加购项','Plan contents, patient price, clinic fee (two rates by review split), minimum term, add-ons'),L('平台运营','Operations'),pri('P0')],
   [`<b>${L('开计划','Start a plan')}</b>`,L('医护在患者详情或计划页开出计划，选择审阅分工和设备交付方式，向患者发送支付链接；需确认已向患者说明费用','From the patient record or plans page; choose review split and device delivery; send pay link; confirm fees were explained'),L('诊所','Clinic'),pri('P0')],
   [`<b>${L('支付与订阅','Payments & subscriptions')}</b>`,L('App 内支付（PayNow、银行卡、Apple Pay / Google Pay），自动续费，扣款失败重试与暂停，收据，取消与暂停','In-app payment (PayNow, cards, Apple Pay / Google Pay), auto-renew, retry and pause on failure, receipts, cancel and pause'),L('患者 / 平台运营','Patients / Operations'),pri('P0')],
   [`<b>${L('服务费结算','Service-fee settlement')}</b>`,L('按人·月和审阅分工计算诊所服务费，月度对账单 PDF','Clinic fees by patient-month and review split; monthly PDF statement'),L('诊所 / 平台运营','Clinic / Operations'),pri('P1')],
   [`<b>${L('集中审阅工作台','Central review console')}</b>`,L('跨机构告警和周审阅队列、响应时限、一键升级给诊所医生（App 通知 + Plato 任务）','Cross-partner alert and weekly-review queue, response SLAs, one-click escalation to the clinic doctor (app + Plato task)'),L('平台集中护士','Central nurses'),pri('P0')],
   [`<b>${L('体检检查单','Screening check orders')}</b>`,L('14 天 CGM 检查和心电筛查：下单、佩戴、报告签发、转长期计划；传感器库存与采购对账','14-day CGM check and ECG screening: order, wear, report sign-off, conversion to plans; sensor stock and purchase statements'),L('体检中心','Screening centre'),pri('P0')],
   [`<b>${L('渠道归属与佣金','Channel attribution & commissions')}</b>`,L('每个渠道和推广员有专属推荐码、二维码和链接；注册时记录获客渠道（与照护诊所分开）；按渠道统计注册、付费、留存；佣金规则（每个有效入组固定金额或固定月费）、30 天确认期、退款扣回、结算单；医疗机构不可设佣金；中介门户不显示健康数据','Unique code, QR and link per channel and promoter; acquisition channel recorded at sign-up, separate from care clinic; sign-ups, paid and retention by channel; commission rules (fixed per qualified enrolment or flat monthly), 30-day confirmation, clawback, statements; no commission for healthcare providers; channel portal shows no health data'),L('平台运营 / 渠道合作方','Operations / channel partners'),pri('P0')],
   [`<b>${L('视频复诊预约','Video consult booking')}</b>`,L('App 读取 Plato 可约时段并预约；费用由诊所在 Plato 收取，可用 CHAS / MediSave','App reads Plato slots and books; the clinic charges in Plato, CHAS / MediSave can apply'),L('患者 / 诊所','Patients / Clinic'),pri('P1')]
  ])}
  <div class="callout">${L('<b>合规要点：</b>新加坡医疗理事会 (SMC) 道德准则规定，医生不能仅因转介病人或推荐产品而获得经济利益，费用必须事先透明告知。因此诊所收入设计为“按实际提供的临床服务计的固定服务费”，不按转介人数或销售额提成，并在患者账单里逐项列出。MediSave 不能支付计划月费。平台集中护士提供远程服务，是否需要 HCSA 远程医疗相关牌照需在上线前确认。',
  '<b>Compliance:</b> the Singapore Medical Council (SMC) ethical code bars doctors from financial benefit solely for referring patients or prescribing products, and fees must be disclosed in advance. So clinic income is a fixed fee for clinical services actually delivered, never a commission on referrals or sales, and it is itemised on the patient’s bill. MediSave cannot pay plan fees. Whether the central nurse service needs an HCSA telemedicine-related licence must be confirmed before launch.')}</div>
 </section>

 <section id="dev"><h2>${L('设备接入','Device integration')}</h2>
  ${tbl([L('设备','Device'),L('连接方式','Connection'),L('数据','Data'),L('说明','Notes')],[
   [L('血压计','BP monitor'),'BLE · Blood Pressure Service 0x1810',L('收缩压、舒张压、脉率、测量时间','SYS, DIA, pulse, timestamp'),L('优先选支持标准 GATT 的型号，可减少逐个对接','Prefer standard-GATT models to avoid per-model work')],
   [L('心电卡 MD100C','ECG card MD100C'),L('BLE 自定义服务 0xFEE9 · 厂商 iOS / Android SDK','BLE custom service 0xFEE9 · vendor iOS / Android SDK'),L('30 秒单导心电（250 Hz）、心率、血氧 + 脉率、导联脱落状态；房颤风险报告（字段待厂商提供）','30 s single-lead ECG (250 Hz), HR, SpO₂ + pulse, lead-off status; AF risk report (field pending from vendor)'),L('正在注册 HSA Class B。平台原样展示设备算法给出的节律提示并标注来源，不做二次判读；波形按段上传，保存原始文件供医生复核','HSA Class B registration in progress. The platform shows the device’s own rhythm flags with their source and adds no interpretation of its own; waveforms upload in chunks and the raw file is kept for doctor review')],
   [L('智能戒指','Smart ring'),'BLE · HBand (Veepoo) SDK',L('心率、HRV、血氧、睡眠、体温（型号未定，按能力表适配）','HR, HRV, SpO₂, sleep, temperature (model-dependent)'),L('与手环共用同一 SDK，一次接入两类设备；多为周期同步','Shares one SDK with the band, so one integration covers both; periodic sync')],
   [L('智能手环','Smart band'),'BLE · HBand (Veepoo) SDK',L('步数、心率、睡眠、血氧；部分型号有血压估算','Steps, HR, sleep, SpO₂; some models estimate BP'),L('手环血压为估算值，只作参考，不触发临床告警','Band BP is an estimate: shown for reference, never triggers clinical alerts')],
   [`Sinocare CGM`,L('云对云 API（主）+ App 端 API','Cloud-to-cloud API (primary) + in-app API'),L('连续血糖值、趋势箭头、传感器状态','Glucose readings, trend arrow, sensor status'),L('两路数据按读数时间 + 传感器序列号去重；需确认接口频率限制与延迟','Dedupe both paths by reading time + sensor serial; confirm rate limits and latency')]
  ])}
  <p>${L('<b>iOS：</b>CoreBluetooth，开启 bluetooth-central 后台模式，后台扫描需指定服务 UUID。<b>Android：</b>Android 12+ 需申请“附近设备”（BLUETOOTH_SCAN / CONNECT）权限；长时间同步使用前台服务；注意国产 ROM 的后台限制，引导用户关闭省电优化。',
  '<b>iOS:</b> CoreBluetooth with the bluetooth-central background mode; background scans must name service UUIDs. <b>Android:</b> Android 12+ needs the Nearby devices permission (BLUETOOTH_SCAN / CONNECT); long syncs use a foreground service; some OEM ROMs kill background apps, so guide users to turn off battery optimization.')}</p>
  <div class="callout">${L('<b>HBand SDK（github.com/HBandSDK）：</b>提供 iOS（Objective-C）和 Android 原生 SDK，Apache-2.0 许可，中英文文档，含固件升级 (OTA)。没有 Flutter / React Native 版本，所以 App 用 Flutter 时通过 platform channel 分别封装两端原生 SDK，对上层暴露统一的 Dart 接口（连接、同步、读取各类数据）。具体可读取的指标以所选戒指和手环型号为准，需向 Veepoo 确认。',
  '<b>HBand SDK (github.com/HBandSDK):</b> native iOS (Objective-C) and Android SDKs, Apache-2.0, docs in Chinese and English, includes firmware update (OTA). There is no Flutter or React Native package, so a Flutter app wraps each native SDK behind a platform channel and exposes one Dart interface (connect, sync, read metrics). Which metrics are available depends on the chosen ring and band models; confirm with Veepoo.')}</div>

 <div class="callout">${L('<b>心电卡 MD100C 通信协议 v1.0.0 要点（来自厂商文档）：</b>BLE 服务 0000FEE9-…，1 个写特征 + 7 个通知特征；帧格式 0x55 0xAA + 命令 + 参数 + 校验和。离线模式可读取记录条数、每条记录的时间和心率、30 秒波形（7,500 个采样点，即 250 Hz，12 位，264 = 1 mV），以及血氧记录；读取后可按条删除。实时模式可开始/结束测量，推送实时心电、血氧脉率和导联脱落状态。App 每次连接先同步日期时间（0x7A/0x7B），再拉取离线记录。<br><b>注意：</b>这份协议里心电记录的 uStatus、uResult 字段标为“保留”，没有定义房颤风险。房颤风险报告需要厂商提供新版协议或 SDK 的字段说明；在此之前，所有心电记录进入“待医生复核”队列，不自动生成房颤告警。',
  '<b>ECG card MD100C protocol v1.0.0 (vendor document):</b> BLE service 0000FEE9-…, one write characteristic and seven notify characteristics; frames are 0x55 0xAA + command + params + checksum. Offline mode reads the record count, each record’s time and HR, the 30 s waveform (7,500 samples, i.e. 250 Hz, 12-bit, 264 = 1 mV) and SpO₂ records, and can delete records one by one after reading. Real-time mode starts and stops measurement and streams live ECG, SpO₂ + pulse and lead-off status. On every connection the app syncs date and time (0x7A/0x7B), then pulls offline records.<br><b>Note:</b> in this protocol the ECG record fields uStatus and uResult are marked reserved, and no AF risk is defined. The AF risk report needs a field definition from the vendor’s newer protocol or SDK. Until then, every ECG goes to a doctor review queue and no AF alert is raised automatically.')}</div>
 </section>

 <section id="cms"><h2>${L('诊所 CMS 对接：Plato（预留）','Clinic CMS integration: Plato (reserved)')}</h2>
  <p>${L('第一版不依赖 CMS 上线，但中台预留集成层：所有对外数据走统一的 FHIR R4 接口，诊所 CMS 用适配器接入（支持 FHIR、REST API、HL7 v2 或 CSV/SFTP 文件交换）。患者用“RPM 患者 ID ↔ CMS 病历号”映射表关联。在 CMS 接通之前，随访记录和监测摘要可导出 PDF 供手动归档。',
  'Version 1 does not depend on the CMS, but the platform reserves an integration layer: all outbound data uses one FHIR R4 interface, and each clinic CMS connects through an adapter (FHIR, REST API, HL7 v2 or CSV/SFTP). Patients link through an RPM ID ↔ CMS record number map. Until the CMS is connected, follow-up notes and monitoring summaries export to PDF for manual filing.')}</p>
  <div class="callout">${L('<b>首批诊所使用 Plato（API 文档已核对）。</b>地址 https://clinic.platomedical.com/api/{db}/…，{db} 是诊所数据库名；认证用 <code>Authorization: Bearer &lt;API key&gt;</code>，每家诊所一个 key。文档未写频率限制，列表接口用 skip / current_page 分页。适配器按下表对接；Plato 没有可写入的体征/图表接口，所以监测数据以病历备注 + PDF 附件的形式进入 Plato，原始读数留在我们的中台。',

  survey:[L('随访问卷','Follow-up survey'),L('问卷由诊所在随访模板中配置，结果结构化回传到诊所端随访记录。','Clinics configure surveys in follow-up templates; answers return to the clinic’s follow-up record as structured data.')],
  msg:[L('与照护团队沟通','Care team chat'),L('告警发生后护士可直接在此联系患者。','After an alert the nurse can reach the patient here.')],
  offer:[L('开通计划与支付（新增）','Plan checkout (new)'),L('患者登录后看到医生开出的计划。账单把平台费用和诊所临床服务费分开列出，满足费用事先告知的要求。iOS 显示 Apple Pay，Android 显示 Google Pay，两端都支持 PayNow 和银行卡。','After sign-in the patient sees the plan their doctor started. The bill lists platform and clinic service fees separately so costs are disclosed up front. iOS shows Apple Pay, Android shows Google Pay; both support PayNow and cards.')],
  plan:[L('我的计划（新增）','My plan (new)'),L('续费日期、传感器配送进度、账单和取消入口集中在一页。CGM 计划的传感器按佩戴周期自动寄出。','Renewal date, sensor shipments, receipts and cancel live on one page. CGM sensors ship automatically on the wear cycle.')],
  consult:[L('视频复诊（新增）','Video consult (new)'),L('时段读取诊所 Plato 的 /appointment/slots，预约写回 Plato。复诊费由诊所收，可用 CHAS 和 MediSave，不走平台支付。','Slots come from Plato /appointment/slots and bookings write back to Plato. The clinic charges the fee, which can use CHAS and MediSave; it does not go through platform payments.')],
  check:[L('体检中心 14 天检查（新增）','Screening 14-day check (new)'),L('体检客户的轻量模式：只显示检查进度、当天曲线和饮食记录。检查结束后引导转为长期计划。','A light mode for screening clients: progress, today’s trace and meal logging only. At the end it points to an ongoing plan.')],
  me:[L('我的','Me'),L('语言切换在此（与系统语言同步，可手动改）。家属共享为 P2。','Language switch lives here (follows system, can override). Family sharing is P2.')]
 };
 const [h,b]=N[S.app]||N.home;
 return `<div class="box hl"><b>${h}</b><p>${b}</p></div>
 <div class="box"><b>${L('iOS 与 Android 差异','iOS vs Android')}</b><p>${L('同一套功能与信息架构。iOS 用大标题和底部标签栏；Android 用 Material 3 顶部栏和带指示条的底部导航；蓝牙权限、后台运行说明按平台区分。','Same features and structure. iOS uses large titles and a tab bar; Android uses a Material 3 top bar and a navigation bar with an active pill. Bluetooth permission and background copy differ per platform.')}</p></div>
 <div class="box"><b>${L('试一试','Try it')}</b><p>${L('点击底部导航、指标卡、“添加设备”、“去填写”等可在页面间跳转。右上角可切换中英文。','Tap the tab bar, metric tiles, Add device or Start to move between screens. Switch language at the top right.')}</p></div>`;
}

/* ---------- render + events ---------- */
const root=document.getElementById('root');
function render(){
 document.documentElement.lang=S.lang==='zh'?'zh-CN':'en';
 let main=S.tab==='spec'?spec():S.tab==='clinic'?clinic():app();
 root.innerHTML=top()+main+modal()+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
}
let tt;function toast(m){S.toast=m;render();clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;render()},2200)}
let timers=[];const later=(f,ms)=>timers.push(setTimeout(f,ms));
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 if(el.dataset.act==='close'&&e.target.closest('[data-stop]')&&!e.target.closest('button[data-act="close"]'))return;
 const a=el.dataset.act,v=el.dataset.v;
 if(el.tagName==='A')e.preventDefault();
 switch(a){
  case 'tab':S.tab=v;window.scrollTo(0,0);break;
  case 'lang':S.lang=v;break;
  case 'cv':S.cv=v;break;
  case 'org':S.org=v;S.cv={clinic:'dash',screen:'scr',ops:'nurse',partner:'pstats'}[v];break;
  case 'rx':S.pid=v;if(el.dataset.pl)S.rxPlan=el.dataset.pl;S.modal='rx';break;
  case 'rxpl':S.rxPlan=v;break;
  case 'st':S.st=v;break;
  case 'sw':el.classList.toggle('on');return;
  case 'rxrev':S.rxRev=v;break;
  case 'pt':S.pid=v;S.ptab='overview';S.cv='patient';S.tab='clinic';break;
  case 'ptab':S.ptab=v;break;
  case 'os':S.os=v;break;
  case 'app':S.app=v;S.tab='app';if(v==='pair')S.pair=0;break;
  case 'dseg':S.dseg=v;S.app='data';break;
  case 'pairgo':S.app='pair';S.pair=0;break;
  case 'ptype':S.pairType=v;S.pair=1;later(()=>{if(S.app==='pair'&&S.pair===1){S.pair=2;render()}},1600);break;
  case 'pconfirm':S.pair=3;break;
  case 'cgmgo':S.app='cgm';break;
  case 'cgmauth':S.cgm=1;break;
  case 'cgmok':S.cgm=2;break;
  case 'cgmreset':S.cgm=0;break;
  case 'paid':S.app='home';save();render();toast(L('支付成功，计划已开通','Paid. Your plan is active'));return;
  case 'survey':S.app='fu';save();render();toast(L('问卷已提交，已同步给陈护士','Survey sent to Nurse Chen'));return;
  case 'fu':S.modal=v;break;
  case 'close':S.modal=null;break;
  case 'ack':{const x=A.find(z=>z.id==+v);x.st='done';save();render();toast(L('告警已处理','Alert resolved'));return}
  case 'a2f':{const x=A.find(z=>z.id==+v);x.st='fu';const p=pById(x.pid);F.unshift({id:'F'+Date.now(),pid:x.pid,how:'phone',why:['告警触发','Alert-triggered'],what:[`${x.t[0]}：${typeof x.v==='string'?x.v:x.v[0]}`,`${x.t[1]}: ${typeof x.v==='string'?x.v:x.v[1]}`],due:['今天','Today'],col:'today',owner:['陈护士','Nurse Chen']});render();toast(L(`已为${p.n[0]}创建今日随访`,`Follow-up created for ${p.n[1]} today`));return}
  case 'newpt':toast(L('新建患者表单（示意）','New patient form (illustrative)'));return;
  case 'toast':toast(v);return;
 }
 save();render();
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.modal){S.modal=null;render()}
 if(e.key==='Enter'&&e.target.matches('tr[data-act]'))e.target.click();
});
document.addEventListener('submit',e=>{
 if(e.target.id==='rxform'){e.preventDefault();S.modal=null;render();toast(L('计划已开出，支付链接已发到患者 App','Plan started; pay link sent to the patient app'));return}
 if(e.target.id!=='fuform')return;e.preventDefault();
 const f=F.find(x=>x.id===S.modal);
 if(f){f.col='done';f.res=['已完成随访，下次 10月8日','Done, next on Oct 8'];S.modal=null;render();toast(L('随访记录已保存','Follow-up note saved'));}
 else{const p=pById(S.pid);F.push({id:'F'+Date.now(),pid:p.id,how:'phone',why:['临时随访','Ad hoc'],what:[document.getElementById('fu-what').value,document.getElementById('fu-what').value],due:['10月3日','Oct 3'],col:'up',owner:['陈护士','Nurse Chen']});S.modal=null;render();toast(L('随访已创建','Follow-up created'));}
});
render();
})();
</script>
